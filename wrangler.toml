name = "cli-box"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2024-09-23"

[[routes]]
pattern = "cli.iterverse.net"
custom_domain = true

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[vars]
PUBLIC_USE_PRD_ASSETS = "true"

# Not secret - a team domain and an audience tag are just identifiers,
# visible in the Zero Trust dashboard and every Access redirect URL (see
# iterverse_hub's enroll.ts/admin.ts for the canonical version of this
# comment). ACCESS_AUD is specific to the Access Application gating THIS
# service's /auth/access* - get it from Zero Trust dashboard -> Access ->
# Applications -> (that app) -> Overview -> Application Audience (AUD) Tag.
ACCESS_TEAM_DOMAIN = "dawn-mountain-9c54.cloudflareaccess.com"
ACCESS_AUD = "3f035bae1ea2f3231d3f73b68ea099cdc620d49304adb1481f66d4bdb78b076d"
ROSTER_API_URL = "https://roster-api.iterverse.net"

# ROSTER_SERVICE_KEY is a secret, not a var - not stored here
# (`wrangler secret put ROSTER_SERVICE_KEY`). It must be the exact same
# value as iterverse_hub's own SERVICE_KEY secret and every other
# product's ROSTER_SERVICE_KEY (koodo-bridge, emu_print) - a mismatch
# here fails every entitlement check with a 401, which this app's own
# code treats identically to "not entitled" and shows as a normal
# /no-access page, not an error. That silent-failure mode is exactly
# what happened on 2026-09-04 (a hand-copied value drifted out of sync)
# and cost a real debugging session to track down. Fixed by rotating
# the value and pushing the identical new secret to all four services
# in one pass rather than re-copying it by hand again.

# Session store for src/lib/server/session.js. "SESSIONS" was already
# taken as a namespace *title* by emu_print's own session store (titles
# are account-unique, bindings aren't) - this one's titled "CLI_SESSIONS"
# but keeps the same "SESSIONS" binding name the code across every
# Iterverse service uses. Created with:
#   npx wrangler kv namespace create CLI_SESSIONS
[[kv_namespaces]]
binding = "SESSIONS"
id = "c6412210eac54b93a2342984d1f5129d"
